<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Driver — expanding header + map sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- Euclid Circular A isn't free; substitute with a comparable geometric grotesque -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background:
      radial-gradient(1200px 800px at 30% 10%, #f4f1ec 0%, transparent 60%),
      radial-gradient(900px 700px at 80% 90%, #ecedef 0%, transparent 55%),
      #e8e6e2;
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    color: rgb(24,12,32);
    overflow: hidden;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
  }
  /* Substitute font name so author code can keep referencing 'Euclid Circular A' */
  @font-face {
    font-family: 'Euclid Circular A';
    font-style: normal; font-weight: 400 700;
    src: local('Inter');
  }
  #root { transform-origin: center center; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pinBounceIn {
    0%   { transform: scale(0.75); }
    60%  { transform: scale(1.08); }
    100% { transform: scale(1);    }
  }
  @keyframes pinShrink {
    from { transform: scale(1.35); }
    to   { transform: scale(1);    }
  }
  .pin-bounce-in { animation: pinBounceIn 0.35s cubic-bezier(0.34,1.4,0.64,1) both; transform-origin: center bottom; }
  .pin-shrink    { animation: pinShrink  0.2s ease-out both;                         transform-origin: center bottom; }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.5; }
    50% { transform: scale(1.4); opacity: 0.2; }
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateX(-50%) translateY(10px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }
  button:active { transform: scale(0.98); }
  button { transition: transform 0.1s ease; }
  .driver-tip {
    background: rgb(24,12,32); color: #fff; font-family: 'Inter', sans-serif;
    font-size: 11px; font-weight: 500; padding: 4px 8px; border: none;
    border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  .driver-tip:before { display: none; }
  .leaflet-container { font-family: 'Inter', sans-serif; isolation: isolate; }
  .leaflet-overlay-pane { mix-blend-mode: multiply; }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://unpkg.com/h3-js@4.1.0/dist/h3-js.umd.js"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="config.js"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="app.jsx?v=3"></script>
  <script type="text/babel">

    // scale to fit viewport
    const fit = () => {
      const el = document.getElementById('root');
      if (!el) return;
      const W = 375, H = 812;
      const pad = 40;
      const vw = Math.max(320, window.innerWidth);
      const vh = Math.max(480, window.innerHeight);
      if (vw < 400) {
        el.style.transform = 'none';
        el.style.width = '100vw';
        el.style.height = '100vh';
        el.style.maxWidth = 'none';
        el.style.maxHeight = 'none';
        return;
      }
      const sx = (vw - pad) / W;
      const sy = (vh - pad) / H;
      const s = Math.max(0.4, Math.min(1.1, Math.min(sx, sy)));
      el.style.transform = `scale(${s})`;
      el.style.width = `${W}px`;
      el.style.height = `${H}px`;
    };
    window.addEventListener('resize', fit);
    new ResizeObserver(fit).observe(document.body);
    fit();
    setTimeout(fit, 100);
    setTimeout(fit, 500);
  </script>
</body>
</html>
